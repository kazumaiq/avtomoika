<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="AUTOMOIKA — стилизованный 3D-симулятор управления автомойкой с живым городом, конкурентом, экономикой и детальным процессом мойки."
    />
    <meta name="theme-color" content="#0e1118" />
    <title>AUTOMOIKA — 3D Симулятор Автомойки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Yandex Games SDK auto-loader (loads /sdk.js when hosted on Yandex Games, silently falls back locally) -->
    <script>
      window.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
      (function () {
        var s = document.createElement('script');
        s.src = '/sdk.js';
        s.async = true;
        s.onerror = function () {
          /* Local / standalone mode uses built-in adService simulator */
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
